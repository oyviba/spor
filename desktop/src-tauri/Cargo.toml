[package]
name = "spor-desktop"
version = "0.1.0"
edition = "2021"
description = "Spor: a git client for working alongside coding agents, as a Tauri app over the spor core"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace, so the root crate stays a dependency-free library with
# its own lockfile.
[workspace]

[lib]
name = "spor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
spor = { path = "../.." }
tauri = { version = "2.9", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
