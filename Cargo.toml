[package]
name = "spor"
version = "0.1.0"
edition = "2021"
description = "A minimal git client with a GitKraken-inspired timeline, as a TUI and a native app"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oyviba/spor"
keywords = ["git", "tui", "gui", "terminal", "timeline"]
categories = ["command-line-utilities", "development-tools"]
default-run = "spor"

[[bin]]
name = "spor"
path = "src/main.rs"

# Native desktop app (macOS .app, also runs on Linux/Windows). Opt-in so the
# terminal build keeps its single dependency:
#   cargo run --features gui --bin spor-app
[[bin]]
name = "spor-app"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
gui = ["dep:gpui-kit"]

[dependencies]
crossterm = "0.27"
gpui-kit = { version = "0.7.3", optional = true, features = [
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-yaml",
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-html",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
