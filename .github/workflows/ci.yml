name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The core library (the root crate): no dependencies, no UI.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # The app in desktop/: its own Cargo workspace over the core, the web UI,
  # and the end-to-end suites against the real app under Xvfb, with
  # stand-in `claude` and `gh` from desktop/e2e/bin.
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Tauri build and test dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            librsvg2-dev webkit2gtk-driver xvfb jq
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the UI (tsc + vite)
        run: pnpm build
      - name: UI tests
        run: pnpm test
      - name: Format (backend)
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: Clippy (backend)
        working-directory: desktop/src-tauri
        run: cargo clippy --locked -- -D warnings
      # custom-protocol embeds dist/ instead of loading the dev server.
      - name: Build the app
        working-directory: desktop/src-tauri
        run: cargo build --locked --features tauri/custom-protocol
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: End-to-end suites
        run: xvfb-run -a e2e/run-all.sh src-tauri/target/debug/spor-desktop e2e-shots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-e2e-screenshots
          path: desktop/e2e-shots
          if-no-files-found: ignore

  # Spor.app for macOS (universal), from the Tauri bundler. Not signed or
  # notarized: the first launch of a downloaded copy needs right-click → Open.
  macos-app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle Spor.app (universal)
        run: pnpm tauri build --target universal-apple-darwin --bundles app
      - name: Zip the bundle
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent Spor.app Spor-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Spor-macos
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Spor-macos.zip
